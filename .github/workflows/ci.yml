name: Integración continua

# El orden es el del TRD §11.5. Si un paso falla, no sigue. Los pasos de extremo a extremo
# se agregan con la tarea que los crea.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    # Con el navegador y el extremo a extremo, una corrida completa pasa de los 20 minutos de antes,
    # y con el camino del equipo va en 28 a 29 (octubre de 2026): una instalación lenta del navegador
    # en el runner (una vez tardó casi 10 minutos) la cortaba en 30.
    # En 40 se cortó la 89 (2026-10-30), en el último caso del camino del equipo: la corrida ya pasa de 40.
    timeout-minutes: 50
    steps:
      # Cada acción va por el identificador exacto de su commit, no por su etiqueta: una
      # etiqueta se puede mover a otro código sin que aquí cambie nada. Dependabot propone
      # las actualizaciones (.github/dependabot.yml).
      # Con la historia entera: la comprobación del orden de las migraciones compara contra lo que
      # main tenía antes.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: pnpm

      # Las migraciones nuevas van después de todas las de main, y las de main no se tocan (ola 0:
      # dos carriles en paralelo). En una solicitud, HEAD es la fusión de prueba con main y HEAD^1
      # es main. Al entrar a main se compara contra lo que main tenía antes del empuje, que puede
      # traer varios commits (una fusión con rebase). Sin dependencias: va antes de instalar.
      - name: Migraciones en orden
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = "push" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            node scripts/migraciones-en-orden.mjs "$BEFORE" HEAD
          else
            node scripts/migraciones-en-orden.mjs HEAD^1 HEAD
          fi

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Tipos
        run: pnpm typecheck

      - name: Lint, incluida la regla de capas
        run: pnpm lint

      - name: Escaneo de secretos
        run: pnpm secrets

      # Una sola excepción, en package.json (pnpm.auditConfig): GHSA-vfj7-8cjw-p6xm, de
      # `braces`. No tiene versión corregida, solo llega por herramientas de desarrollo
      # (lint) y exige patrones glob ajenos, que aquí no hay. Se quita en cuanto exista
      # corrección.
      #
      # Y un valor forzado, también en package.json (pnpm.overrides): `handlebars` 4.7.10.
      # `eslint-plugin-boundaries` pide la 4.7.9 exacta, que tiene dos avisos críticos
      # desde octubre de 2026. Solo corre con el lint, pero la auditoría no distingue. Se
      # quita en cuanto ese paquete pida una versión corregida.
      - name: Auditoría de dependencias
        run: pnpm audit --audit-level=high

      - name: Pruebas del dominio y de capas
        run: pnpm test

      # TRD §12.2: las reglas de acceso exigen el 100 % de cobertura, archivo por archivo.
      # Va aparte de las pruebas porque con cobertura una corrida parcial fallaría por los
      # archivos que no tocó.
      # El comando va escrito aquí y no como `pnpm test:coverage`: este archivo tiene dueño y
      # `package.json` no, y cambiar allá el guion dejaría este paso sin efecto sin que
      # nadie lo aprobara.
      - name: Cobertura de las reglas de acceso
        run: pnpm exec vitest run --project unit --coverage

      # TRD §11.5, paso 4: la base se levanta vacía, corren todas las migraciones y la
      # semilla desde cero, y después las pruebas de base (políticas por fila, libros de
      # solo inserción, tabla expuesta sin política).
      - name: Base local, migraciones desde cero
        run: pnpm db:start

      - name: Pruebas de base
        run: pnpm test:db

      # TRD §11.5, paso 5: el código contra la base real. Van después de las pruebas de
      # base, que cuentan renglones y esperan la base recién nacida. La contraseña de
      # app_service se inventa en cada corrida y no sale de ella.
      - name: Entorno de las pruebas de integración
        run: node scripts/ci-env.mjs

      - name: Entrada de la aplicación a la base local
        run: pnpm db:login

      # Los textos legales de borrador (versión 0), que solo existen en una base local: sin
      # ellos no se puede completar un registro. Las pruebas de base corren otra vez con
      # ellos cargados, porque tienen que dar lo mismo en los dos estados: el de una base
      # recién nacida, que es también el de una remota, y el de una máquina de desarrollo.
      - name: Borradores legales
        run: pnpm db:drafts

      - name: Pruebas de base, con los borradores
        run: pnpm test:db

      - name: Pruebas de integración
        run: pnpm test:int

      - name: Compilación
        run: pnpm build

      # TRD §11.5: el extremo a extremo de la cuenta (FL-02, FL-03, FL-05 y FL-06), con un
      # navegador de verdad contra la aplicación, la pila local de Supabase y su buzón. Va
      # después de compilar, pero no usa esa compilación: Playwright compila la suya, sin
      # registro de errores, para que nunca se pruebe una de antes (`playwright.config.ts`).
      - name: Navegador para el extremo a extremo
        run: pnpm exec playwright install --with-deps chromium

      # El comando va escrito aquí y no como `pnpm test:e2e`, por lo mismo que el de la
      # cobertura: este archivo tiene dueño y `package.json` no.
      - name: Pruebas de extremo a extremo
        run: pnpm exec playwright test

      # Las pruebas de base cuentan renglones: si el extremo a extremo dejó a una persona de
      # prueba o un contador, aquí se nota.
      - name: Pruebas de base, después del extremo a extremo
        run: pnpm test:db

      # El camino de quien es del equipo (invitar, configurar el segundo factor, entrar a
      # administración). Va al final y aparte: invitar, atar y dar capacidades escriben en la
      # auditoría, que no admite borrado, y las pruebas de base cuentan esos renglones. Después
      # de este paso la base ya no sirve para ellas, y aquí no corre nada más.
      # El comando va escrito aquí, por lo mismo que los de arriba. En local es
      # `pnpm test:e2e:equipo`, que además rehace la base al terminar.
      - name: Pruebas de extremo a extremo del equipo
        run: pnpm exec playwright test
        env:
          E2E_EQUIPO: "1"
